name: K2 Horizon llama-server (Windows, CUDA 12.4, sm_86)

# Builds llama-server from the K2 Horizon fork (branch model/K2Horizon) for
# one GPU: an RTX 3050 Laptop (Ampere, compute 8.6). A single CUDA arch keeps
# the build short. The binaries need the CUDA 12 runtime DLLs
# (cudart64_12, cublas64_12, cublasLt64_12) beside them on the target.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA toolkit
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '12.4'
          cuda_arch: x64

      - name: Install Ninja
        run: choco install ninja

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DGGML_CUDA=ON ^
            -DGGML_NATIVE=OFF ^
            -DCMAKE_CUDA_ARCHITECTURES=86 ^
            -DLLAMA_BUILD_BORINGSSL=ON
          cmake --build build -j %NUMBER_OF_PROCESSORS% --target llama-server llama-cli

      - name: Record commit
        shell: bash
        run: git rev-parse HEAD > build/bin/SOURCE_COMMIT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: llama-k2horizon-win-cuda12.4-sm86
          path: build/bin/
